name: E2E Dev

on:
  workflow_run:
    workflows: ["Deploy Dev"]
    types: [completed]

jobs:
  e2e:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download dev deployment metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifactResponse.data.artifacts.find((entry) => entry.name === 'dev-deployment');
            if (!artifact) {
              core.setFailed('Could not find dev deployment artifact.');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/dev-deployment.zip`, Buffer.from(download.data));

      - name: Extract deployment metadata
        run: |
          unzip dev-deployment.zip -d dev-deployment
          echo "PLAYWRIGHT_BASE_URL=$(node -p \"require('./dev-deployment/dev-deployment.json').url\")" >> $GITHUB_ENV

      - name: Run Playwright tests
        run: npm run test:e2e
