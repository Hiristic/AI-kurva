name: Auto PR to Staging

on:
  workflow_run:
    workflows: ["E2E Dev"]
    types: [completed]

jobs:
  open-pr:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure staging PR exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --base staging --head develop --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open PR already exists: #$EXISTING"
            exit 0
          fi
          gh pr create \
            --base staging \
            --head develop \
            --title "Promote develop to staging" \
            --body "Automatiskt skapad PR efter grön CI, dev-deploy och E2E mot dev-miljön.\n\nVerifiera staging innan merge till main." \
            || echo "No PR created (possibly no diff)."
