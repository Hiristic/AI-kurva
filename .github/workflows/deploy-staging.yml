name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_ALIAS_DOMAIN: ${{ secrets.STAGING_ALIAS_DOMAIN }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate required deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing required secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --scope=hiristics-projects --project=ai-kurva

      - name: Build Vercel output
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }} --scope=hiristics-projects --project=ai-kurva

      - name: Deploy to staging
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --scope=hiristics-projects --project=ai-kurva)
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      - name: Alias staging domain
        if: ${{ env.STAGING_ALIAS_DOMAIN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel alias set ${{ steps.deploy.outputs.url }} "$STAGING_ALIAS_DOMAIN" --token="$VERCEL_TOKEN"

      - name: Verify deployment health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Missing deployment URL output."
            exit 1
          fi
          max_attempts=6
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status_code=$(curl --show-error --location --max-time 20 \
              --output /tmp/staging-health-response.txt --write-out "%{http_code}" "$DEPLOY_URL")
            curl_exit=$?
            status_code=${status_code:-000}
            if [ "$curl_exit" -eq 0 ] && [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              exit 0
            fi
            if [ "$curl_exit" -ne 0 ]; then
              echo "Health check attempt $attempt failed with curl exit code $curl_exit"
            else
              echo "Health check attempt $attempt failed with HTTP status $status_code"
            fi
            cat /tmp/staging-health-response.txt || true
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke test deployed staging site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:e2e
